name: Publish Vocabulary to D-WIS webpage
on:
  workflow_dispatch:
    inputs:
      force_updates:
        description: 'Update all terms even when their descriptions are unchanged'
        type: boolean
        default: false
  workflow_run:
    workflows: [Generate cleaned vocabulary and packages]
    branches: [main]
    types: [completed]

concurrency:
  group: wordpress-vocabulary-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish_vocabulary:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCRIPT_PATH: "${{ github.workspace }}/docs/vocabulary_development/scripts"
      SOURCE_PATH: "${{ github.workspace }}/docs/vocabulary_development/auto-generated/md"
      WORDPRESS_USER: "cicd"
      WORDPRESS_URL: "https://d-wis.org/"
      WORDPRESS_USE_REST_ROUTE: "true"
      WORDPRESS_WORKERS: "2"
      FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_updates || false }}
      REPORT_PATH: "${{ runner.temp }}/publication-report.json"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher dependencies
        run: python -m pip install -r "$SCRIPT_PATH/requirements.txt"
      - name: Test publisher
        working-directory: docs/vocabulary_development/scripts
        run: python -m unittest -v test_update_web_vocabulary.py
      - name: Publish and verify vocabulary
        working-directory: docs/vocabulary_development/scripts
        env:
          WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.WORDPRESS_APPLICATION_PASSWORD }}
        run: python -u update_web_vocabulary.py
      - name: Upload publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-publication-report
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
